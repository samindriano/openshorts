services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    environment:
      - YOLO_MODEL_PATH=/models/yolov8n.pt
      - LOCAL_TIKTOK_PUBLISHER_URL=http://publisher:3200
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    # Keep local Compose on the same restart-safe entrypoint as the image CMD.
    # Because /app is bind-mounted, pulling the guard code + recreating backend
    # is enough; no generated media or uploads are touched.
    command: ["uvicorn", "app_entry:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    depends_on:
      - publisher

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

  publisher:
    build:
      context: .
      dockerfile: publisher/Dockerfile
    container_name: openshorts-local-tiktok-publisher
    volumes:
      - ./output:/output:ro
      - ./publisher-data:/publisher-data
    environment:
      - PUBLISHER_OUTPUT_DIR=/output
      - PUBLISHER_DATA_DIR=/publisher-data
      - TIKTOK_UPLOADER_COMMIT=6f6c594ca087b35bb152b3c60cd0196e7e46b2b9
      - TIKTOK_UPLOADER_HEADLESS=true
      - TIKTOK_UPLOADER_BROWSER=chromium
    restart: unless-stopped
